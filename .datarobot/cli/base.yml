---
root:
  - env: PULUMI_CONFIG_PASSPHRASE
    type: secret_string
    optional: true
    help: "The passphrase used to encrypt and decrypt the private key. This value is required if you're not using pulumi cloud."
  - env: FORECAST_DEPLOYMENT_ID
    type: string
    optional: true
    help: "To use an existing Forecast Deployment, provide the deployment ID"
  - env: TEXTGEN_REGISTERED_MODEL_ID
    type: string
    optional: true
    help: "The registered model ID for TextGen model"
  - env: TEXTGEN_DEPLOYMENT_ID
    type: string
    optional: true
    help: "The deployment ID for TextGen model"
  - env: CHAT_MODEL_NAME
    type: string
    optional: true
    default: "datarobot-deployed-llm"
    help: "The model name expected by the TextGen model (e.g. gpt-4o-mini). For NIM models, 'datarobot-deployed-llm' will automatically be translated to the correct model name."
  - key: "enable_openai"
    help: "Do you want to configure Azure OpenAI?"
    options:
      - name: "No"
      - name: "Yes"
        requires: "openai_config"
  - key: "enable_google_vertexai"
    help: "Do you want to configure Google VertexAI?"
    options:
      - name: "No"
      - name: "Yes"
        requires: "google_cloud_config"
  - key: "enable_aws_bedrock"
    help: "Do you want to configure AWS Bedrock?"
    options:
      - name: "No"
      - name: "Yes"
        requires: "aws_config"

openai_config:
  - env: OPENAI_API_KEY
    type: secret_string
    optional: false
    help: "The API key for Azure OpenAI."
  - env: OPENAI_API_BASE
    type: string
    optional: false
    help: "The API base URL for Azure OpenAI, usually in the format https://<your_custom_endpoint>.openai.azure.com"
  - env: OPENAI_API_DEPLOYMENT_ID
    type: string
    optional: false
    help: "The deployment ID for the Azure OpenAI model."
  - env: OPENAI_API_VERSION
    type: string
    optional: false
    help: "The API version for Azure OpenAI."

google_cloud_config:
  - env: GOOGLE_SERVICE_ACCOUNT
    type: string
    optional: false
    help: "The Google Service Account JSON file content with aiplatform.endpoints.predict permission"
  - env: GOOGLE_REGION
    type: string
    optional: false
    help: "The Google Cloud Region"

aws_config:
  - env: AWS_ACCESS_KEY_ID
    type: string
    optional: false
    help: "The AWS access key ID for Bedrock."
  - env: AWS_SECRET_ACCESS_KEY
    type: secret_string
    optional: false
    help: "The AWS secret access key for Bedrock."
  - env: AWS_REGION
    type: string
    optional: false
    help: "The AWS region name for Bedrock, e.g., us-east-1."
  - env: AWS_SESSION_TOKEN
    type: string
    optional: true
    help: "The AWS Session Token (optional for long term access keys)"
